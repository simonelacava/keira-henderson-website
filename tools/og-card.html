<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@600&amp;display=block" rel="stylesheet">
<style>
:root { --accent: #F26B1D; --accent-text: #A63C06; --bg: #FBF7F2; --ink: #1C1917; --border: #E7DED3; }
html, body { margin: 0; }
body {
  width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif;
  display: grid; grid-template-columns: 1fr 300px;
}
.main { padding: 64px 0 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 18px; }
.mark {
  width: 64px; height: 64px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800; font-size: 27px;
}
.name { font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 600; font-size: 34px; letter-spacing: -0.01em; }
h1 {
  margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-weight: 800;
  font-size: 92px; line-height: 1.02; letter-spacing: -0.035em;
}
h1 span { color: var(--accent); }
.eyebrow { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
.side { background: var(--accent); border-radius: 0 0 0 40px; margin-bottom: 0; }
</style>
</head>
<body>
<div class="main">
<div class="brand"><span class="mark">KH</span><span class="name">Keira Henderson</span></div>
<h1>Know your customers.<br><span>Then act on it.</span></h1>
<p class="eyebrow">Independent customer &amp; user research · UK</p>
</div>
<div class="side"></div>
</body>
</html>
